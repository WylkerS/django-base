# Ambiente exclusivo da suíte automatizada: só o runner Django, sem container de banco.
# Use pelo Makefile (make test, make bandit): ele define um nome de projeto próprio (-p <APP_IMAGE>-test)
# e remove containers, rede e a imagem ao terminar, sem tocar no ambiente de desenvolvimento.
# O banco é o mesmo PostgreSQL externo do .env (POSTGRES_*, sobrescrevíveis no shell): o Django
# cria nele o banco temporário test_<POSTGRES_DB> e o remove ao final. O usuário precisa de CREATEDB.
# As demais configurações do runner são locais de teste; o restante do .env não é lido.

services:
  test-runner:
    build:
      context: .
      args:
        POETRY_INSTALL_GROUPS: dev
    image: ${TEST_IMAGE:-${APP_IMAGE:-projeto-base}:test}
    working_dir: /app/src
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "exec python manage.py test $${TEST_TARGET:-} --noinput"]
    environment:
      APP_NOME: Projeto Base
      SECRET_KEY: test-only-secret-key
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,test-runner
      DJANGO_CSRF_TRUSTED_ORIGINS: http://testserver,http://localhost

      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_HOST: ${POSTGRES_HOST:?defina POSTGRES_HOST no .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_FROM: testes@example.invalid
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      TEST_TARGET: ${TEST_TARGET:-}
    restart: "no"
