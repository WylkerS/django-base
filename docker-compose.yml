# Ambiente completo (implantação): Gunicorn atrás do Nginx, Celery worker e beat.
# Nome do projeto, imagem e portas vêm do .env (COMPOSE_PROJECT_NAME, APP_IMAGE, APP_PORT...),
# para que vários projetos derivados do base convivam na mesma máquina.
# O PostgreSQL não sobe aqui: a aplicação aponta para um banco externo (POSTGRES_* no .env).

x-django-service: &django-service
  build:
    context: .
  image: ${APP_IMAGE:-projeto-base}:latest
  working_dir: /app/src
  env_file:
    - .env
  # O PostgreSQL é externo (POSTGRES_HOST no .env). host.docker.internal permite apontar
  # para um PostgreSQL instalado no próprio host, também no Linux.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    <<: *django-service
    command: python manage.py migrate --noinput

  collectstatic:
    <<: *django-service
    user: root
    command: python manage.py collectstatic --noinput
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully

  django-web:
    <<: *django-service
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      collectstatic:
        condition: service_completed_successfully
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost',8000),timeout=2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    <<: *django-service
    command: celery -A config worker -l info -Q celery
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  celery-worker-rpa:
    <<: *django-service
    command: celery -A config worker -l info -Q rpa --concurrency=1
    profiles:
      - celery
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  celery-beat:
    <<: *django-service
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  flower:
    <<: *django-service
    command: celery -A config flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    profiles:
      - celery
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend-proxy:
    image: nginx:latest
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/static:ro
    depends_on:
      django-web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  static_files:
